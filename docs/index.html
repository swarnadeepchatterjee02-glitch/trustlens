/* ── NARRATIVE ENGINE ──────────────────────────────── */
function buildNarrative(emp) {
  const rPct = Math.round(emp.risk*100);
  const sorted = Object.entries(emp.shap).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const [f1,v1]=sorted[0], [f2,v2]=sorted[1];
  const level = emp.risk>=0.7?"elevated":emp.risk>=0.4?"moderate":"low";
  const verb  = emp.risk>=0.7?"warrants immediate HR intervention":emp.risk>=0.4?"should be monitored proactively":"reflects a stable retention profile";
  const s1=`The XGBoost model assigns ${emp.name} a ${rPct}% probability of departure — ${level} risk that ${verb}.`;
  const s2=`${f1} is the ${v1>0?"primary risk amplifier":"strongest retention anchor"}, contributing ${Math.round(Math.abs(v1)*100)} percentage points to the prediction${v1>0?", and should be the first focus for HR intervention.":"; this factor is actively working in the employee's favour."}`;
  const s3=`${f2} ${v2>0?"compounds the risk":"partially offsets the elevated factors"} by a further ${Math.round(Math.abs(v2)*100)} points${v2>0?", suggesting a compounding pattern that increases urgency.":"."}`;
  const s4=`The Decision Trust Score of ${emp.ts}/100 — derived from ${emp.dq}/100 data quality and ${emp.conf}% model confidence — ${emp.ts>=80?"qualifies this prediction for direct use in decision-making":emp.ts>=60?"is acceptable but human review is recommended":"falls below threshold; qualitative manager input is required before proceeding"}.`;
  const s5="Under EU AI Act Article 6(2), this employment prediction is HIGH-RISK; a qualified HR professional must review and sign off on any resulting action before implementation.";
  return [s1,s2,s3,s4,s5].join(" ");
}

/* ── HELPERS ───────────────────────────────────────── */
const sCol=s=>s>=80?C.green:s>=60?C.amber:C.red;
const sBg =s=>s>=80?C.greenSoft:s>=60?C.amberSoft:C.redSoft;
const rLbl=r=>r>=0.7?"HIGH RISK":r>=0.4?"MEDIUM":"LOW RISK";
const EU_META={HIGH:{c:C.red,bg:C.redSoft,lbl:"HIGH RISK",art:"Art. 6(2)"},MEDIUM:{c:C.amber,bg:C.amberSoft,lbl:"LIMITED RISK",art:"Art. 52"},LOW:{c:C.green,bg:C.greenSoft,lbl:"MINIMAL RISK",art:"Art. 69"}};
function fleetStats(){
  const high=EMPLOYEES.filter(e=>e.risk>=0.7).length;
  const med =EMPLOYEES.filter(e=>e.risk>=0.4&&e.risk<0.7).length;
  const avgTs=Math.round(EMPLOYEES.reduce((s,e)=>s+e.ts,0)/EMPLOYEES.length);
  return{high,med,low:EMPLOYEES.length-high-med,avgTs};
}

/* ── AVATAR ────────────────────────────────────────── */
function Avatar({name,dept,size=32}){
  const d=DEPT[dept]||{bg:"#e2e8f0",fg:"#475569"};
  const ini=name.split(" ").map(w=>w[0]).slice(0,2).join("");
  return <div style={{width:size,height:size,borderRadius:"50%",background:d.bg,color:d.fg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:C.mono,fontSize:size*0.34,fontWeight:"700",flexShrink:0}}>{ini}</div>;
}

/* ── TRUST GAUGE ───────────────────────────────────── */
function TrustGauge({score,size=110}){
  const [live,setLive]=useState(0);
  useEffect(()=>{setLive(0);const t=setTimeout(()=>setLive(score),100);return()=>clearTimeout(t);},[score]);
  const r=44,circ=2*Math.PI*r,arc=(live/100)*circ,col=sCol(live);
  return(
    <svg width={size} height={size} viewBox="0 0 100 100" style={{display:"block",margin:"0 auto"}}>
      <circle cx="50" cy="50" r={r} fill="none" stroke={C.dim} strokeWidth="8"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={col} strokeWidth="8" strokeLinecap="round"
        strokeDasharray={`${arc} ${circ}`} transform="rotate(-90 50 50)"
        style={{transition:"stroke-dasharray 1.1s cubic-bezier(.34,1.56,.64,1),stroke .4s"}}/>
      <text x="50" y="46" textAnchor="middle" fill={col} fontSize="22" fontWeight="700" fontFamily={C.mono}>{live}</text>
      <text x="50" y="60" textAnchor="middle" fill={C.muted} fontSize="9" fontFamily={C.mono}>/100</text>
    </svg>
  );
}

/* ── DIVERGING SHAP ────────────────────────────────── */
function DivergingShap({shapValues}){
  const rows=Object.entries(shapValues).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const mx=Math.max(...rows.map(([,v])=>Math.abs(v)));
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",marginBottom:"10px",paddingLeft:"130px"}}>
        <div style={{flex:1,textAlign:"right",paddingRight:"12px",fontFamily:C.mono,fontSize:"9px",color:C.green}}>← protective factors</div>
        <div style={{width:"1px",height:"16px",background:C.borderMd,flexShrink:0}}/>
        <div style={{flex:1,paddingLeft:"12px",fontFamily:C.mono,fontSize:"9px",color:C.red}}>risk factors →</div>
      </div>
      {rows.map(([feat,val],i)=>{
        const pct=(Math.abs(val)/mx)*100, pos=val>0, col=pos?C.red:C.green;
        return(
          <div key={feat} style={{display:"flex",alignItems:"center",height:"28px",borderRadius:"4px",background:i%2===0?C.raised:"transparent",marginBottom:"2px",padding:"0 4px"}}>
            <div style={{width:"122px",flexShrink:0,textAlign:"right",paddingRight:"10px",fontFamily:C.mono,fontSize:"10.5px",color:C.sub,whiteSpace:"nowrap",overflow:"hidden"}}>{feat}</div>
            <div style={{width:"1px",height:"20px",background:C.borderMd,flexShrink:0}}/>
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:"3px",overflow:"hidden"}}>
              {!pos&&<div style={{height:"11px",borderRadius:"3px 0 0 3px",background:`linear-gradient(to left,#bbf7d0,${C.green})`,width:`${pct}%`,transition:"width .85s cubic-bezier(.34,1.56,.64,1)"}}/>}
            </div>
            <div style={{flex:1,display:"flex",alignItems:"center",paddingLeft:"3px",overflow:"hidden"}}>
              {pos&&<div style={{height:"11px",borderRadius:"0 3px 3px 0",background:`linear-gradient(to right,#fecaca,${C.red})`,width:`${pct}%`,transition:"width .85s cubic-bezier(.34,1.56,.64,1)"}}/>}
            </div>
            <div style={{width:"42px",flexShrink:0,textAlign:"left",paddingLeft:"6px",fontFamily:C.mono,fontSize:"10px",fontWeight:"700",color:col}}>{pos?"+":""}{(val*100).toFixed(0)}%</div>
          </div>
        );
      })}
    </div>
  );
}

/* ── FLEET DISTRIBUTION ────────────────────────────── */
function FleetDistribution(){
  const bands=[{label:"0–59",color:C.red,count:EMPLOYEES.filter(e=>e.ts<60).length},{label:"60–79",color:C.amber,count:EMPLOYEES.filter(e=>e.ts>=60&&e.ts<80).length},{label:"80–100",color:C.green,count:EMPLOYEES.filter(e=>e.ts>=80).length}];
  const mx=Math.max(...bands.map(b=>b.count));
  return(
    <div style={{padding:"12px 14px",borderTop:`1px solid ${C.border}`}}>
      <div style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".16em",marginBottom:"10px"}}>TRUST DISTRIBUTION</div>
      <div style={{display:"flex",gap:"8px",alignItems:"flex-end",height:"48px"}}>
        {bands.map(b=>(
          <div key={b.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}}>
            <span style={{fontFamily:C.mono,fontSize:"10px",fontWeight:"700",color:b.color}}>{b.count}</span>
            <div style={{width:"100%",background:C.dim,borderRadius:"3px 3px 0 0",overflow:"hidden"}}>
              <div style={{height:`${(b.count/mx)*28}px`,background:b.color,opacity:.7}}/>
            </div>
            <span style={{fontFamily:C.mono,fontSize:"7.5px",color:C.muted}}>{b.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── BENTO METRICS ─────────────────────────────────── */
function BentoMetrics({sel}){
  const rCol=sel.risk>=0.7?C.red:sel.risk>=0.4?C.amber:C.green;
  const rBg =sel.risk>=0.7?C.redSoft:sel.risk>=0.4?C.amberSoft:C.greenSoft;
  const riskPct=Math.round(sel.risk*100);
  const eu={c:C.red,bg:C.redSoft,lbl:"HIGH RISK",art:"Art. 6(2)"};
  return(
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gridTemplateRows:"auto auto",gap:"10px",marginBottom:"14px"}}>
      <div style={{gridRow:"1 / span 2",background:C.surface,borderRadius:"12px",border:`1px solid ${C.border}`,borderTop:`3px solid ${sCol(sel.ts)}`,padding:"16px",textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(15,23,42,.06)",gap:"6px"}}>
        <div style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".18em"}}>TRUST SCORE</div>
        <TrustGauge score={sel.ts} size={110}/>
        <div style={{fontFamily:C.mono,fontSize:"9px",fontWeight:"700",color:sCol(sel.ts),background:sBg(sel.ts),padding:"3px 10px",borderRadius:"20px",border:`1px solid ${sCol(sel.ts)}22`}}>
          {sel.ts>=80?"RELIABLE":sel.ts>=60?"NEEDS REVIEW":"VERIFY FIRST"}
        </div>
      </div>
      <div style={{background:rBg,borderRadius:"12px",border:`1px solid ${rCol}22`,borderTop:`3px solid ${rCol}`,padding:"14px",boxShadow:"0 1px 4px rgba(15,23,42,.04)"}}>
        <div style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".16em",marginBottom:"8px"}}>ATTRITION RISK</div>
        <div style={{fontFamily:C.mono,fontSize:"32px",fontWeight:"700",color:rCol,lineHeight:1}}>{riskPct}<span style={{fontSize:"14px",color:C.muted}}>%</span></div>
        <div style={{fontFamily:C.mono,fontSize:"9px",color:rCol,fontWeight:"600",margin:"5px 0 8px"}}>{rLbl(sel.risk)}</div>
        <div style={{position:"relative",height:"8px",background:C.dim,borderRadius:"4px",overflow:"hidden"}}>
          <div style={{position:"absolute",left:0,width:"33%",height:"100%",background:`linear-gradient(90deg,${C.greenSoft},${C.green}22)`}}/>
          <div style={{position:"absolute",left:"33%",width:"34%",height:"100%",background:`linear-gradient(90deg,${C.amber}22,${C.amber}44)`}}/>
          <div style={{position:"absolute",left:"67%",width:"33%",height:"100%",background:`linear-gradient(90deg,${C.red}22,${C.red}55)`}}/>
          <div style={{position:"absolute",top:"-1px",left:`calc(${riskPct}% - 5px)`,width:"10px",height:"10px",borderRadius:"50%",background:rCol,border:"2px solid white",boxShadow:"0 1px 3px rgba(0,0,0,.2)",transition:"left .6s cubic-bezier(.34,1.56,.64,1)"}}/>
        </div>
      </div>
      <div style={{background:eu.bg,borderRadius:"12px",border:`1px solid ${eu.c}22`,borderTop:`3px solid ${eu.c}`,padding:"14px",boxShadow:"0 1px 4px rgba(15,23,42,.04)"}}>
        <div style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".16em",marginBottom:"8px"}}>EU AI ACT STATUS</div>
        <div style={{fontFamily:C.mono,fontSize:"15px",fontWeight:"700",color:eu.c}}>{eu.lbl}</div>
        <div style={{fontFamily:C.mono,fontSize:"9px",color:C.muted,margin:"3px 0 8px"}}>{eu.art} — HR System</div>
        <div style={{fontSize:"10px",color:eu.c,background:`${eu.c}10`,borderRadius:"5px",padding:"5px 8px",lineHeight:"1.5"}}>Human oversight required</div>
      </div>
      <MetricCard label="MODEL CONFIDENCE" value={sel.conf} unit="%" color={sCol(sel.conf)} bg={sBg(sel.conf)} sub="XGBoost v1.7"/>
      <MetricCard label="DATA QUALITY" value={sel.dq} unit="/100" color={sCol(sel.dq)} bg={sBg(sel.dq)} sub={`${sel.miss} missing · ${sel.out} outlier`}/>
    </div>
  );
}

/* ── MAIN APP ──────────────────────────────────────── */
function TrustLens(){
  const [sel,setSel]=useState(EMPLOYEES[0]);
  const [report,setReport]=useState(null);
  const [gen,setGen]=useState(false);
  const [search,setSearch]=useState("");
  useEffect(()=>{setReport(null);},[sel.id]);
  const stats=useMemo(()=>fleetStats(),[]);
  const filtered=EMPLOYEES.filter(e=>e.name.toLowerCase().includes(search.toLowerCase())||e.role.toLowerCase().includes(search.toLowerCase())||e.dept.toLowerCase().includes(search.toLowerCase()));
  function generate(){setGen(true);setReport(null);setTimeout(()=>{setReport(buildNarrative(sel));setGen(false);},800);}
  const deptInfo=DEPT[sel.dept]||{bg:C.dim,fg:C.sub};

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:C.sans,display:"flex",flexDirection:"column"}}>

      {/* TOP BAR */}
      <div style={{height:"56px",background:C.surface,borderBottom:`1px solid ${C.borderMd}`,display:"flex",alignItems:"center",padding:"0 20px",gap:"16px",flexShrink:0,boxShadow:"0 1px 3px rgba(15,23,42,.07)"}}>
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="12" stroke={C.blue} strokeWidth="1" opacity=".3"/>
          <circle cx="13" cy="13" r="7.5" stroke={C.blue} strokeWidth="1.4" opacity=".7"/>
          <circle cx="13" cy="13" r="2.5" fill={C.blue}/>
          {[0,90,180,270].map(deg=>{const rad=deg*Math.PI/180;return<line key={deg} x1={13+Math.cos(rad)*9.2} y1={13+Math.sin(rad)*9.2} x2={13+Math.cos(rad)*11.5} y2={13+Math.sin(rad)*11.5} stroke={C.blue} strokeWidth="1.2" opacity=".4"/>;})}
        </svg>
        <span style={{fontFamily:C.mono,fontSize:"14px",fontWeight:"700",letterSpacing:".1em",color:C.text}}>TRUSTLENS</span>
        <span style={{fontSize:"11px",color:C.muted}}>Decision Intelligence Platform</span>
        <div style={{flex:1}}/>
        {[{label:"Analysed",value:EMPLOYEES.length,color:C.blue,bg:C.blueSoft},{label:"High Risk",value:stats.high,color:C.red,bg:C.redSoft},{label:"Medium",value:stats.med,color:C.amber,bg:C.amberSoft},{label:"Avg Trust",value:stats.avgTs,color:C.green,bg:C.greenSoft}].map(({label,value,color,bg})=>(
          <div key={label} style={{display:"flex",alignItems:"center",gap:"6px",background:bg,border:`1px solid ${color}22`,borderRadius:"6px",padding:"4px 10px"}}>
            <span style={{fontFamily:C.mono,fontSize:"9px",color:C.muted}}>{label}</span>
            <span style={{fontFamily:C.mono,fontSize:"13px",fontWeight:"700",color}}>{value}</span>
          </div>
        ))}
        <div style={{fontFamily:C.mono,fontSize:"9px",color:C.blue,border:`1px solid ${C.blue}30`,borderRadius:"4px",padding:"3px 9px",background:C.blueSoft}}>EU AI ACT 2024</div>
      </div>

      {/* BODY */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* SIDEBAR */}
        <div style={{width:"252px",borderRight:`1px solid ${C.borderMd}`,display:"flex",flexDirection:"column",background:C.surface,flexShrink:0}}>
          <div style={{padding:"10px 12px",borderBottom:`1px solid ${C.border}`}}>
            <input type="text" placeholder="Search employees..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:"100%",padding:"6px 10px",border:`1px solid ${C.borderMd}`,borderRadius:"6px",fontFamily:C.sans,fontSize:"11.5px",color:C.text,background:C.raised,outline:"none"}}/>
          </div>
          <div style={{flex:1,overflowY:"auto"}}>
            <div style={{padding:"10px 14px 6px",fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".18em"}}>EMPLOYEES ({filtered.length})</div>
            {filtered.map(e=><SidebarCard key={e.id} emp={e} active={e.id===sel.id} onClick={()=>setSel(e)}/>)}
          </div>
          <FleetDistribution/>
        </div>

        {/* MAIN PANEL */}
        <div style={{flex:1,overflowY:"auto",padding:"20px 22px",minWidth:0}}>

          {/* Employee header */}
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"14px",marginBottom:"16px",paddingBottom:"16px",borderBottom:`1px solid ${C.border}`}}>
            <div style={{display:"flex",gap:"14px",alignItems:"center"}}>
              <Avatar name={sel.name} dept={sel.dept} size={52}/>
              <div>
                <div style={{fontFamily:C.mono,fontSize:"8px",color:C.blue,letterSpacing:".2em",marginBottom:"4px"}}>▸ ACTIVE ANALYSIS · {sel.id}</div>
                <h1 style={{margin:"0 0 3px",fontSize:"20px",fontWeight:"700",letterSpacing:"-.02em"}}>{sel.name}</h1>
                <div style={{fontSize:"13px",color:C.sub}}>{sel.role}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginTop:"7px"}}>
                  <span style={{fontSize:"10px",fontFamily:C.mono,background:deptInfo.bg,color:deptInfo.fg,padding:"2px 8px",borderRadius:"20px"}}>{sel.dept}</span>
                  {[`Age ${sel.age}`,`${sel.tenure}yr`,`$${sel.income.toLocaleString()}/mo`,`${sel.prev} prev employers`,sel.ot==="Yes"?"Overtime":"No overtime"].map(s=><span key={s} style={{fontFamily:C.mono,fontSize:"9.5px",color:C.muted}}>{s}</span>)}
                </div>
              </div>
            </div>
          </div>

          <BentoMetrics sel={sel}/>

          {/* SHAP CHART */}
          <div style={{background:C.surface,borderRadius:"12px",border:`1px solid ${C.border}`,padding:"18px 18px 14px",marginBottom:"14px",boxShadow:"0 1px 4px rgba(15,23,42,.05)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
              <div><span style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".18em"}}>SHAP FEATURE ATTRIBUTION</span><span style={{fontFamily:C.mono,fontSize:"8px",color:C.sub,marginLeft:"12px"}}>XGBoost · Explainable AI</span></div>
              <div style={{display:"flex",gap:"12px"}}>
                {[[C.green,"Protective"],[C.red,"Risk"]].map(([c,l])=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:"5px"}}>
                    <div style={{width:"10px",height:"10px",borderRadius:"2px",background:`linear-gradient(90deg,${c}44,${c})`}}/>
                    <span style={{fontFamily:C.mono,fontSize:"9px",color:C.muted}}>{l}</span>
                  </div>
                ))}
              </div>
            </div>
            <DivergingShap shapValues={sel.shap}/>
            <div style={{marginTop:"12px",paddingTop:"10px",borderTop:`1px solid ${C.border}`,fontFamily:C.mono,fontSize:"9px",color:C.muted}}>Trust Score = Data Quality × 0.30 + Model Confidence × 0.40 + SHAP Clarity × 0.30</div>
          </div>

          {/* BOTTOM GRID */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <div style={{background:C.surface,borderRadius:"12px",border:`1px solid ${C.border}`,padding:"18px",display:"flex",flexDirection:"column",minHeight:"240px",boxShadow:"0 1px 4px rgba(15,23,42,.05)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
                <span style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".18em"}}>DECISION REPORT</span>
                <span style={{fontFamily:C.mono,fontSize:"8px",color:C.sub,background:C.raised,padding:"2px 8px",borderRadius:"4px",border:`1px solid ${C.border}`}}>Rule-Based Engine</span>
              </div>
              {!report&&!gen&&(
                <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"12px"}}>
                  <p style={{fontSize:"11px",color:C.muted,textAlign:"center",lineHeight:"1.65",margin:0,maxWidth:"180px"}}>Generate a structured decision report from SHAP values, risk scores, and EU AI Act rules.</p>
                  <button onClick={generate} style={{background:C.blue,border:"none",color:"#fff",padding:"9px 22px",borderRadius:"6px",fontFamily:C.mono,fontSize:"10px",letterSpacing:".08em",cursor:"pointer"}}>GENERATE REPORT →</button>
                </div>
              )}
              {gen&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:"10px"}}><div style={{width:"26px",height:"26px",border:`2px solid ${C.dim}`,borderTopColor:C.blue,borderRadius:"50%",animation:"spin .75s linear infinite"}}/><span style={{fontFamily:C.mono,fontSize:"10px",color:C.muted}}>Running rule engine...</span></div>}
              {report&&!gen&&(
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:"10px"}}>
                  <p style={{margin:0,fontSize:"11.5px",lineHeight:"1.8",color:C.text,flex:1}}>{report}</p>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:"8px",borderTop:`1px solid ${C.border}`}}>
                    <span style={{fontFamily:C.mono,fontSize:"8px",color:C.muted}}>For informational use · HR review required</span>
                    <button onClick={generate} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.sub,padding:"4px 10px",borderRadius:"4px",fontFamily:C.mono,fontSize:"9px",cursor:"pointer"}}>↺ Regenerate</button>
                  </div>
                </div>
              )}
            </div>

            <div style={{background:C.surface,borderRadius:"12px",border:`1px solid ${C.border}`,padding:"18px",boxShadow:"0 1px 4px rgba(15,23,42,.05)"}}>
              <div style={{fontFamily:C.mono,fontSize:"8px",color:C.muted,letterSpacing:".18em",marginBottom:"14px"}}>DATA INTEGRITY AUDIT</div>
              <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
                {[{label:"Missing Fields",val:sel.miss,max:10,inv:true},{label:"Outlier Flags",val:sel.out,max:5,inv:true},{label:"Quality Score",val:sel.dq,max:100,inv:false},{label:"Completeness",val:(100-sel.miss*3)|0,max:100,inv:false},{label:"Reliability",val:Math.round(sel.dq*0.4+sel.conf*0.6),max:100,inv:false}].map(({label,val,max,inv})=>{
                  const pct=Math.min((val/max)*100,100);
                  const col=inv?(val===0?C.green:val<=1?C.amber:C.red):sCol(val);
                  return(
                    <div key={label}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
                        <span style={{fontFamily:C.mono,fontSize:"10px",color:C.sub}}>{label}</span>
                        <span style={{fontFamily:C.mono,fontSize:"10px",fontWeight:"700",color:col}}>{val}</span>
                      </div>
                      <div style={{background:C.dim,height:"5px",borderRadius:"3px",overflow:"hidden"}}>
                        <div style={{width:`${pct}%`,height:"100%",background:col,borderRadius:"3px",transition:"width .6s ease"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"5px",marginTop:"14px",paddingTop:"12px",borderTop:`1px solid ${C.border}`}}>
                {[["ETL Pipeline",C.green,"PASS"],["Quality Gate",sel.dq>=90?C.green:C.amber,sel.dq>=90?"PASS":"WARN"],["Rule Engine",C.blue,"ACTIVE"],["EU Compliance",C.red,"REVIEW REQUIRED"]].map(([label,col,status])=>(
                  <div key={label} style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                      <div style={{width:"5px",height:"5px",borderRadius:"50%",background:col}}/>
                      <span style={{fontFamily:C.mono,fontSize:"9px",color:C.sub}}>{label}</span>
                    </div>
                    <span style={{fontFamily:C.mono,fontSize:"9px",fontWeight:"600",color:col}}>{status}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div style={{marginTop:"14px",padding:"10px 0",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontFamily:C.mono,fontSize:"9px",color:C.muted}}>TrustLens v2.0 · Swarnadeep Chatterjee · 2025</span>
            <span style={{fontFamily:C.mono,fontSize:"9px",color:C.muted}}>IBM Watson HR · 25 records · XGBoost · SHAP · Rule-Based Engine</span>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TrustLens/>);
</script>
</body>
</html>
